<!doctype html>
<meta charset="utf-8">
<script>
// Página receptora del token OAuth para renovación silenciosa vía iframe.
// Lee el access_token del fragmento de URL y lo posta al padre.
const p = new URLSearchParams(location.hash.slice(1));
const msg = {
  type:          'ow_oauth_silent',
  access_token:  p.get('access_token'),
  expires_in:    p.get('expires_in'),
  error:         p.get('error'),
};
try {
  if (window.parent !== window) window.parent.postMessage(msg, location.origin);
  else if (window.opener)       window.opener.postMessage(msg, location.origin);
} catch(e) {}
</script>
